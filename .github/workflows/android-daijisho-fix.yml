name: Android APK (Daijisho launch fix)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;30.0.15729638"

      - name: Build debug APK (installs as org.dolphinemu.dolphinemu.debug)
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-daijisho-fix-apk
          path: Source/Android/app/build/outputs/apk/debug/*.apk
