name: Android APK (Daijisho launch fix)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runners ship the Android SDK preinstalled in $ANDROID_HOME.
      - name: Install NDK and accept SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;30.0.15729638" "platforms;android-37" "build-tools;37.0.0" || "$SDKM" --install "ndk;30.0.15729638"

      - name: Build debug APK (installs as org.dolphinemu.dolphinemu.debug)
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a

      - name: List built APKs
        run: find Source/Android -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-daijisho-fix-apk
          path: Source/Android/**/outputs/apk/**/*.apk
          if-no-files-found: error
