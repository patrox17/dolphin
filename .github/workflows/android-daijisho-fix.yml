name: Android APK (Daijisho launch fix)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runners ship the Android SDK preinstalled in $ANDROID_HOME.
      - name: Install NDK and accept SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;30.0.15729638" "platforms;android-37" "build-tools;37.0.0" || "$SDKM" --install "ndk;30.0.15729638"

      - name: Build debug APK (installs as org.dolphinemu.dolphinemu.debug)
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ARGS="--no-daemon -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false"
          # Data/Sys is copied into the app assets by CMake, which on a clean checkout runs after
          # Gradle has already merged the assets. Build twice so the APK includes Sys
          # (fonts, per-game settings, shaders...).
          ./gradlew assembleDebug $ARGS
          ./gradlew assembleDebug $ARGS

      # Collect the app APK and make sure Android's package installer will accept it
      # (an APK marked testOnly is rejected as "invalid package").
      - name: Collect and verify APK
        run: |
          mkdir -p out
          APK=$(find Source/Android/app/build -name '*.apk' -not -path '*androidTest*' | head -n 1)
          echo "APK: $APK"
          cp "$APK" out/dolphin-daijisho-fix-arm64.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          if ! unzip -l out/dolphin-daijisho-fix-arm64.apk | grep -q "assets/Sys/GC/font_western.bin"; then
            echo "APK is missing the Sys folder (GameCube fonts)"; exit 1
          fi
          "$AAPT2" dump badging out/dolphin-daijisho-fix-arm64.apk | grep -E "^package:|native-code|testOnly" || true
          if "$AAPT2" dump xmltree --file AndroidManifest.xml out/dolphin-daijisho-fix-arm64.apk | grep -q 'testOnly.*=true\|testOnly.*0xffffffff'; then
            echo "APK is marked testOnly, the installer would reject it"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-daijisho-fix-apk
          path: out/dolphin-daijisho-fix-arm64.apk
          if-no-files-found: error
